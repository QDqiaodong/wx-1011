spring:
  datasource:
    url: jdbc:h2:mem:paddling_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cache:
    type: none
